generations:
  - name: "First Generation"
    start_year: 2021
    end_year: 2025
    description: "The original Voyah Free was the first production model from Voyah, the premium electric vehicle brand of Chinese state-owned Dongfeng Motor Corporation. Introduced in Q3 2021, the Free is a mid-size luxury SUV designed to compete with established premium electric vehicles. The exterior styling was led by Italian design house Italdesign Giugiaro, resulting in a sleek, modern appearance with a distinctive front light bar, floating roof design, and flush door handles. The vehicle was offered in both pure electric (EV) and extended-range electric vehicle (EREV) configurations. The EV version featured a dual-motor all-wheel-drive setup producing approximately 510 horsepower with an 88 kWh battery pack, while the EREV variant combined a smaller battery with a 1.5-liter turbocharged petrol engine acting as a generator (Dongfeng C15TDR series engine with 41.07% thermal efficiency), extending the total range. The interior offered a premium experience with high-quality materials, a minimalist design centered around a large central touchscreen and digital instrument cluster, and extensive ambient lighting. Advanced technology features included facial recognition, augmented reality head-up display, level 2+ driver assistance systems with three millimeter wave radars, 9 cameras, and 12 ultrasonic radars. Series production began in late January 2021. The electric model was discontinued in August 2023."
  - name: "First Generation (Facelift)"
    start_year: 2023
    end_year: 2025
    description: "The 2023 facelift of the Voyah Free brought updated specifications while maintaining the same platform. The pure electric version was discontinued, leaving only the extended-range (EREV) model available. The battery capacity increased to 39 kWh for the EREV variant. Voyah also introduced the high-performance limited edition model called Voyah Free DNA, featuring even higher power output (4.3 second 0-100 km/h acceleration), a dual motor AWD system with comprehensive maximum power of 360/490 kW/ps, and a special body kit with exterior modifications. The facelifted models retained the premium interior with air suspension, comprehensive driver assistance features including active night vision system effective up to 150 meters, and the signature Italian-designed exterior styling."
  - name: "Second Generation (Free+)"
    start_year: 2025
    end_year: null
    description: "The Voyah Free+ is a completely new generation that replaced the original Free in 2025. Unveiled at Auto Shanghai 2025, the Free+ features the 'City Light and Shadow Aesthetics' design language with increased dimensions - length and width have grown while the wheelbase increased by 70mm. The interior features a 10.25-inch digital instrument cluster, a 29-inch AR-HUD, and a 15.6-inch 2K central infotainment touchscreen running Huawei's HarmonySpace 5 cockpit system, plus a rear control touchscreen for passengers. All seats have heating and ventilation functions, with the front passenger seat reclining up to 163 degrees. The center console includes 50-watt active cooled wireless charging and a refrigerator. It features a 22-speaker Huawei Sound system and a panoramic sunroof. The Free+ is one of the first vehicles equipped with Huawei's ADS 4.0 system, featuring a 29-sensor suite including one 192-line LiDAR, three 4D mmWave radars, and 11 cameras for L2 semiautonomous driving. The Free+ is available exclusively with a range-extender powertrain using a 1.5-liter turbocharged inline-four engine generator combined with a 43.2 kWh LFP battery capable of 3C charging (20-80% in 20 minutes). Both RWD (318 variant) and AWD configurations are available."